apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-vllm-local-smoke
  namespace: lambda-llm-serving
  labels:
    app: qwen-vllm-local-smoke

spec:
  replicas: 1

  selector:
    matchLabels:
      app: qwen-vllm-local-smoke

  template:
    metadata:
      labels:
        app: qwen-vllm-local-smoke

    spec:
      containers:
        - name: vllm
          image: qwen-vllm:phase3
          imagePullPolicy: IfNotPresent

          command: ["/bin/bash", "-lc"]
          args:
            - |
              echo "Kubernetes started the qwen-vllm image successfully"
              echo "MODEL_DIR=$MODEL_DIR"
              echo "SERVED_MODEL_NAME=$SERVED_MODEL_NAME"
              echo "PORT=$PORT"
              echo "Checking vLLM binary:"
              which vllm
              vllm --help | head -20
              echo "Keeping pod alive for inspection..."
              sleep 3600

          env:
            - name: MODEL_DIR
              value: /models/qwen_lora_merged_v1
            - name: SERVED_MODEL_NAME
              value: qwen_lora_merged_v1
            - name: PORT
              value: "8000"
